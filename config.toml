# =============================================================================
# Presse-Agrumes — configuration unique
# =============================================================================
# Ce fichier est versionné avec le projet. En production, changez au minimum
# le mot de passe ci-dessous, puis restreignez allowed_roots à vos partages.
#
# Après modification : redémarrez l'application (./run.sh ou systemctl restart).
# Aucune variable d'environnement n'est utilisée : tout est ici.
# =============================================================================

[server]
# Adresse d'écoute. 0.0.0.0 = accessible depuis le réseau local.
host = "0.0.0.0"

# Port interne de l'application.
# En Docker, le mapping `ports:` de Compose doit utiliser ce port côté
# conteneur (exemple : "8473:8473" si port = 8473).
# S'il est occupé, l'application cherche le suivant et affiche le port réel.
port = 8473

[paths]
# Dossier des scans, jobs, tests et benchmarks.
# Relatif au dossier contenant ce fichier, ou chemin absolu.
# Pour Docker, le wizard génère un data_dir absolu (/data) monté sur un volume.
# Pour l'installation native, "./data" pointe vers le dossier du projet.
data_dir = "./data"

# Dossiers que l'application a le droit de parcourir / modifier / supprimer.
# IMPORTANT : en production, ne laissez pas "/" ! Liste tes partages média.
# Exemple NAS : allowed_roots = ["/mnt/media", "/srv/media", "/volume1/videos"]
# En Docker, ce sont les chemins vus DANS le conteneur : les volumes de
# docker-compose.yml doivent exposer les médias à ces mêmes chemins.
allowed_roots = ["/"]

[auth]
# Authentification HTTP Basic de l'interface web.
user = "agrumes"

# ⚠ MOT DE PASSE À CHANGER EN PRODUCTION.
# Mets ici un mot de passe long et unique. Le fichier doit être protégé :
#   chmod 600 config.toml
# et appartenir à l'utilisateur qui lance le service.
password = "changez-moi"

# true = désactive complètement l'authentification. À réserver au développement
# local (127.0.0.1), jamais sur le NAS.
disabled = false

[ffmpeg]
# Facultatif : chemins absolus si ffmpeg/ffprobe ne sont pas dans le PATH.
# ffmpeg = "/usr/bin/ffmpeg"
# ffprobe = "/usr/bin/ffprobe"

# =============================================================================
# Notes Docker
# =============================================================================
# config.toml = configuration de l'APPLICATION (auth, port interne, chemins,
# allowed_roots, ffmpeg). docker-compose.yml = configuration du CONTENEUR
# (image, volumes, mapping de port, UID/GID, devices). Ce ne sont pas des
# doublons : Compose ne connaît pas le mot de passe ni allowed_roots.
#
# En Docker, ne montez pas ce fichier du dépôt : l'entrypoint génère
# automatiquement /data/config.toml (volume /data) au premier démarrage, avec
# un mot de passe aléatoire affiché dans les logs.
#
# Pour une installation native, ce fichier est utilisé directement ; il peut
# aussi être monté dans le conteneur avec --config.
# =============================================================================
