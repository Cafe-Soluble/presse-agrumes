# =============================================================================
# Presse-Agrumes - Docker Compose
# =============================================================================
# Installation recommandée. Aucun config.toml à créer : il est généré dans
# ./data au premier démarrage, avec un mot de passe aléatoire affiché dans les
# logs.
#
#   1. Adapter les 3 valeurs marquées « À ADAPTER » ci-dessous.
#      - user: l'UID/GID qui possède ./data et les médias (`id -u`, `id -g`).
#      - port: le port d'accès dans le navigateur.
#      - volume média: le chemin réel sur le NAS (il doit exister).
#   2. Donner ./data au même UID/GID que « user: » :
#        sudo chown -R 1000:1000 data
#      (remplace 1000:1000 par les valeurs de user:)
#   3. docker compose up -d
#   4. docker compose logs --tail=50
#      La ligne « première configuration » n'apparaît qu'au premier démarrage.
#      Si elle est absente : docker compose ps -a doit montrer « Exited (1) »,
#      et les logs indiquent l'erreur (souvent les permissions de ./data).
#
# Rappel des volumes : le format est « hôte:conteneur ».
#   - à gauche : chemin réel sur le NAS (à adapter) ;
#   - à droite : chemin vu par l'application (ne pas changer).
# =============================================================================
services:
  presse-agrumes:
    image: ghcr.io/cafe-soluble/presse-agrumes:0.11.2
    container_name: presse-agrumes

    # À ADAPTER - UID:GID qui possède ./data et les médias.
    # Trouver les valeurs avec : id -u && id -g
    # Exemples : Synology 1026:100, Unraid 99:100, utilisateur classique 1000:1000.
    user: "1000:1000"

    ports:
      # À ADAPTER - « port du navigateur:port interne ».
      #   À gauche  : port sur le NAS (celui que tu ouvres dans le navigateur).
      #   À droite  : 8473, port interne de l'application - ne pas changer,
      #               sauf si [server] port est modifié dans ./data/config.toml.
      - "8473:8473"

    volumes:
      # À ADAPTER (obligatoire) - « dossier média sur le NAS:chemin conteneur ».
      # Vérifie que le dossier hôte existe : ls -ld /volume1/media
      #
      # Deux approches possibles :
      #
      # a) Monter le dossier média exact (le plus simple) :
      - /volume1/media:/media
      #
      # b) Monter la racine du partage, puis choisir le sous-dossier dans
      #    l'assistant (plus besoin de modifier le Compose ensuite) :
      #      OMV      : - /srv:/srv
      #      Synology : - /volume1:/volume1
      #      Unraid   : - /mnt:/mnt
      #
      # Ne monte pas « / » : cela exposerait tout le NAS à l'application.
      # À droite (/media, /srv...), ne pas changer : c'est le chemin vu par
      # l'application, et il doit être dans allowed_roots de config.toml.

      # NE PAS CHANGER - « dossier du projet:/data ».
      #   ./data : dossier à côté de ce docker-compose.yml (données persistantes).
      #   /data  : configuration générée, scans, jobs, tests, benchmarks.
      # Il doit exister et être inscriptible par l'UID défini dans user:.
      - ./data:/data

      # Optionnel - fuseau horaire du NAS (planification aux heures locales).
      - /etc/localtime:/etc/localtime:ro

    # Optionnel - accélération VAAPI (si /dev/dri existe sur le NAS).
    # Utilise des GID NUMÉRIQUES : les groupes "video" et "render" n'existent
    # pas forcément dans l'image, et Docker refuse alors de démarrer.
    #
    # Sur le NAS :
    #   getent group video
    #   stat -c '%g' /dev/dri/renderD128
    #
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "44"     # GID du groupe video
    #   - "105"    # GID de /dev/dri/renderD128 (valeur d'exemple)
    #
    # Vérifie ensuite : docker exec presse-agrumes vainfo

    restart: unless-stopped
    # Healthcheck défini dans l'image (/healthz).
