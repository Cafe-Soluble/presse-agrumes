# Docker Compose pour Presse-Agrumes.
#
# Installation minimale : une seule commande, la configuration est créée au
# premier démarrage dans ./data/config.toml avec un mot de passe aléatoire
# affiché par `docker compose logs`.
#
#   mkdir -p data && sudo chown -R 1000:1000 data
#   docker compose up -d
#   docker compose logs | grep -A5 "première configuration"
#
# Adaptez l'UID/GID et le chemin média ci-dessous.
services:
  presse-agrumes:
    image: ghcr.io/cafe-soluble/presse-agrumes:latest
    container_name: presse-agrumes
    # UID/GID qui possède les médias et le dossier ./data.
    # Sur Synology/Unraid, remplacez par votre UID utilisateur (id -u / id -g).
    user: "1000:1000"
    # Le port conteneur (8473) doit correspondre à [server] port dans
    # ./data/config.toml. Le port hôte est celui du navigateur.
    ports:
      - "8473:8473"
    volumes:
      # Configuration générée + scans/jobs/tests/benchmarks.
      # Le mot de passe est dans ./data/config.toml, pas dans Compose.
      - ./data:/data
      # Vos médias : ce chemin doit être dans [paths] allowed_roots
      # (par défaut /media dans la configuration générée).
      - /mnt/media:/media
      # Fuseau horaire pour la planification.
      - /etc/localtime:/etc/localtime:ro
      # Accélération VAAPI (optionnel, si /dev/dri existe sur le NAS) :
      # - /dev/dri:/dev/dri
    # Pour VAAPI, ajoutez les groupes de la carte graphique :
    # group_add:
    #   - video
    #   - render
    restart: unless-stopped
    # Le healthcheck est défini dans l'image (/healthz).
