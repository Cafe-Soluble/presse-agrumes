[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "presse-agrumes"
version = "0.11.2"
description = "Analyse et compression AV1 de bibliothèques vidéo, avec interface web."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CafeSoluble" }]
keywords = ["av1", "ffmpeg", "video", "nas", "compression"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[project.scripts]
presse-agrumes = "presse_agrumes.__main__:main"

[tool.setuptools.packages.find]
include = ["presse_agrumes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
